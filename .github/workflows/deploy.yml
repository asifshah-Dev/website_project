name: Deploy Next.js Static Site to Hostinger

on:
  push:
    branches:
      - main  # Change to 'master' if your primary branch is master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build static production files
      run: npm run build

    - name: Sync files to Hostinger Root Domain
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftps
        security: loose
        timeout: 60000
        local-dir: ./out/
        server-dir: /domains/://deltatechbridge.com
        dangerous-clean-slate: true
