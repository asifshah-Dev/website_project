name: Deploy Next.js Static Site to Hostinger

on:
  push:
    branches:
      - main  # ⚠️ Note: If your primary GitHub branch is named 'master', change 'main' to 'master'

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build static production files
      run: npm run build

    - name: Sync files to Hostinger Subdomain
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./out/
        server-dir: /public_html/test/
        dangerous-clean-html: false # This prevents your custom .htaccess file from being deleted
